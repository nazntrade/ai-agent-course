<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Agent</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header>
    <h1>Knowledge Agent</h1>
    <div id="health" class="health">Checking embedding provider…</div>
  </header>

  <div id="error" class="error hidden"></div>

  <main>
    <section class="panel">
      <h2>Чат (RAG)</h2>
      <div class="row">
        <select id="chat-strategy" title="Какой индекс использовать для режима «С RAG»">
          <option value="active">Активный индекс</option>
          <option value="fixed">Fixed</option>
          <option value="structure">Structure</option>
        </select>
        <input id="chat-top-k" type="number" value="5" min="1" max="50" title="Сколько фрагментов запрашивать" />
        <input id="chat-max-context" type="number" min="1" placeholder="Лимит контекста (необязательно)" />
      </div>
      <div class="row">
        <textarea id="chat-question" rows="4" placeholder="Введите вопрос"></textarea>
      </div>
      <div class="row">
        <button id="chat-plain">Без RAG</button>
        <button id="chat-rag" class="primary">С RAG</button>
        <button id="chat-compare">Сравнить</button>
      </div>
      <div class="row d23-settings">
        <span class="meta">Retrieval settings</span>
        <select id="d23-mode" title="Day 23 retrieval mode">
          <option value="A">A: plain RAG</option>
          <option value="B">B: RAG + filter</option>
          <option value="C">C: RAG + rewrite</option>
          <option value="D">D: RAG + rewrite + filter</option>
        </select>
        <input id="d23-min-score" type="number" step="0.05" min="0" max="1" value="0" placeholder="Min score" title="Minimum cosine similarity" />
        <input id="d23-prefilter" type="number" min="1" max="50" value="20" title="Prefilter top-K" />
        <input id="d23-postfilter" type="number" min="1" max="50" value="5" title="Postfilter top-K" />
        <button id="d23-ask">Ask with selection</button>
      </div>
      <div id="chat-status" class="meta"></div>
      <div id="chat-search-query" class="meta"></div>
      <div id="chat-sources"></div>
      <div id="chat-answer" class="chat-answer"></div>
      <div id="d23-trace" class="meta"></div>
      <div id="chat-compare-result"></div>
    </section>

    <section class="panel">
      <h2>Compare four modes</h2>
      <div class="row">
        <button id="d23-compare" class="primary">Run four-mode comparison</button>
      </div>
      <div id="d23-compare-result"></div>
    </section>

    <section class="panel">
      <h2>Collection</h2>
      <div class="row">
        <select id="collection-select"></select>
        <input id="collection-name" type="text" placeholder="New collection name" />
        <button id="collection-create">Create collection</button>
        <button id="refresh">Refresh</button>
      </div>
    </section>

    <section class="panel">
      <h2>Build index</h2>
      <div class="row">
        <select id="strategy">
          <option value="fixed">Fixed</option>
          <option value="structure">Structure</option>
        </select>
        <input id="source-path" type="text" placeholder="Explicit source path (PDF/TXT/MD)" />
        <input id="source-label" type="text" placeholder="Label (optional)" />
        <button id="add-source">Add source</button>
        <button id="build" class="primary">Build</button>
      </div>
      <ul id="source-list" class="source-list"></ul>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="progress-text"></span>
      </div>
    </section>

    <section class="panel">
      <h2>Index versions</h2>
      <table id="versions">
        <thead>
          <tr><th>ID</th><th>Strategy</th><th>Status</th><th>Sources</th><th>Documents</th><th>Sections</th><th>Chunks</th><th>Active</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Search fragments</h2>
      <div class="row">
        <input id="query" type="text" placeholder="Search query" />
        <select id="search-strategy" title="Which index to search">
          <option value="active">Active index</option>
          <option value="fixed">Fixed</option>
          <option value="structure">Structure</option>
        </select>
        <input id="top-k" type="number" value="5" min="1" max="50" />
        <button id="search" class="primary">Search</button>
      </div>
      <div id="fragments"></div>
    </section>

    <section class="panel">
      <h2>Compare strategies</h2>
      <div class="row">
        <button id="compare">Load comparison</button>
      </div>
      <div id="compare-result"></div>
    </section>

    <section class="panel">
      <h2>Chunks</h2>
      <div class="row">
        <label><input id="chunks-active" type="checkbox" checked /> Active index only</label>
        <button id="load-chunks">Load chunks</button>
      </div>
      <div id="chunks"></div>
      <details id="chunk-detail" class="detail hidden">
        <summary>Chunk metadata</summary>
        <pre id="chunk-detail-body"></pre>
      </details>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
